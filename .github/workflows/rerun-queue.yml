# The rerun queue (scripts/rerunq.py; ledger K6). One tick:
# read notes/rerun_queue.json, take at most one action, commit, push, exit.
# Any failed tick disables this workflow, so nothing continues past a halt
# until Rahul has read it and re-enabled the workflow by hand.
# Three things start a tick: the job's own successor (the last step, when
# the repository variable RERUNQ_SELF_SCHEDULE is "on"; ledger N45), GitHub's
# schedule (a backstop: on this account it fires hours apart), and any
# workflow_dispatch (cron-job.org's, which has started nothing since
# 2026-10-23, or one by hand).

name: rerun-queue

# Minutes 7, 22, 37, 52: off the quarter-hours, which GitHub names as high
# load (ledger K6, schedule test of 2026-10-23; was "*/15 * * * *").
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write   # rerunq-notify.sh only (ledger K6, NOTIFY)

concurrency:
  group: rerun-queue
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: Asia/Kolkata
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12, as on the laptop
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the laptop's pinned environment
        run: python -m pip install --quiet -r requirements.lock

      # OAuth, as on the laptop (ledger K10, 2026-11-12, Rahul's decision).
      # The secret holds a credentials.json from a "kaggle auth login" made
      # for Actions alone; only its refresh token, username and scopes are
      # written, and the CLI refreshes the access token on first use. No
      # access_token and no kaggle.json are written: the CLI would use
      # either before credentials.json (rerunq-creds.sh, CRED6 and CRED7).
      # Contents are never printed.
      - name: Write the Kaggle credentials (never printed)
        env:
          RERUNQ_KAGGLE_OAUTH: ${{ secrets.KAGGLE_OAUTH_CREDENTIALS }}
        run: bash scripts/rerunq-creds.sh ericsom

      - name: Git identity for the queue's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: One tick
        id: tick
        run: python scripts/rerunq.py tick --run-id "${{ github.run_id }}.${{ github.run_attempt }}"

      - name: Upload the rescue copy
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rerunq-rescue-${{ github.run_id }}-${{ github.run_attempt }}
          path: scratch-rerunq/
          if-no-files-found: ignore
          retention-days: 90

      - name: Disable this workflow (halt, failure, or queue done)
        if: always() && (failure() || steps.tick.outputs.disable == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable rerun-queue.yml --repo "${{ github.repository }}"

      - name: Remove the Kaggle credentials
        if: always()
        run: rm -f "$HOME/.kaggle/credentials.json"

      # NOTIFY (2026-11-03, ledger K6; Rahul's instruction after the s13 halt
      # went unseen for eight hours). Reports only: opens or comments on a
      # GitHub issue assigned to and mentioning the owner, which GitHub
      # emails by default. The Actions failure email does not reach anyone,
      # because these runs are started by github-actions[bot]. Runs after
      # the disable and the credential removal; continue-on-error, so it
      # cannot change the job's conclusion, the successor step (which needs
      # success() and is skipped on these runs anyway) or the halt.
      - name: Report a failed tick or a finished queue (issue)
        if: always() && (failure() || steps.tick.outputs.disable == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          KIND: ${{ job.status == 'failure' && 'failure' || 'done' }}
        run: bash scripts/rerunq-notify.sh "$KIND" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # SELF-SCHEDULING (2026-11-01, ledger N45; the mechanism of horizon's
      # loop, which has run on its own successors since 2026-10-24). The job
      # starts its own successor with workflow_dispatch, which the job's
      # GITHUB_TOKEN may do, so no external dispatcher is needed. Unlike
      # horizon, it never runs after a failed or halting tick: success()
      # excludes every nonzero tick exit (3 halt, 1 error), and the disable
      # output excludes DONE. After the sleep it reads main's state again
      # and the workflow's state, so a halt or a disable made during the
      # sleep (by hand or through rerun-queue-admin) stops the chain. The
      # schedule above stays as a backstop that restarts a broken chain; a
      # run that arrives while one is in progress waits in the concurrency
      # group, and GitHub cancels it when the successor is queued, so at most
      # one tick runs and one waits.
      # COST: the sleep keeps a runner busy. The repository is public, so
      # standard GitHub-hosted runners are not billed (corrected 2026-11-03;
      # this comment used to call it private and billed). The step still
      # runs only when the repository variable RERUNQ_SELF_SCHEDULE is "on";
      # it stays on, and cost is no reason to switch it off (Rahul's
      # decision, ledger K6, NOTIFY).
      - name: Start the next tick
        if: success() && steps.tick.outputs.disable != 'true' && vars.RERUNQ_SELF_SCHEDULE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          next=$(python scripts/rerunq.py next-wake --min 60 --max 900)
          echo "next-wake after the tick: $next"
          secs=${next%% *}
          if [ "$secs" = "none" ]; then echo "no successor: $next"; exit 0; fi
          sleep "$secs"
          git fetch -q origin main && git reset -q --hard origin/main
          again=$(python scripts/rerunq.py next-wake --min 60 --max 900)
          echo "next-wake after the sleep, on main's tip: $again"
          if [ "${again%% *}" = "none" ]; then echo "no successor: $again"; exit 0; fi
          wf=$(gh api "repos/${{ github.repository }}/actions/workflows/rerun-queue.yml" --jq .state)
          if [ "$wf" != "active" ]; then echo "no successor: the workflow is $wf"; exit 0; fi
          for i in 1 2 3; do
            if gh workflow run rerun-queue.yml --repo "${{ github.repository }}" --ref main; then
              echo "successor started after $secs s"; exit 0
            fi
            sleep 30
          done
          echo "::warning title=rerun queue::the successor could not be started; the schedule restarts the chain"
          exit 1
